<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sea" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#22c1dc"/>
      <stop offset="0.45" stop-color="#0b6fb8"/>
      <stop offset="1" stop-color="#062456"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b6efff"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5fe3ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5fe3ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="shape">
      <rect x="24" y="24" width="464" height="464" rx="108"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#03163a" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g clip-path="url(#shape)">
    <rect x="24" y="24" width="464" height="464" fill="url(#sea)"/>
    <circle cx="256" cy="270" r="230" fill="url(#glow)"/>
    <!-- ondas da orla -->
    <path d="M24 392 C100 360 160 424 256 392 S410 360 488 392 V488 H24Z" fill="#ffffff" fill-opacity="0.07"/>
    <path d="M24 428 C100 400 170 458 262 428 S412 402 488 428 V488 H24Z" fill="#021a44" fill-opacity="0.35"/>
    <path d="M24 392 C100 360 160 424 256 392 S410 360 488 392" fill="none" stroke="#9cecff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
    <!-- brilho -->
    <ellipse cx="256" cy="110" rx="210" ry="96" fill="url(#gloss)"/>
  </g>

  <!-- monograma OD -->
  <g fill="none" stroke="url(#mark)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <circle cx="186" cy="250" r="90"/>
    <path d="M322 160 V340 M322 160 H332 A90 90 0 0 1 332 340 H322"/>
  </g>
  <!-- nó tech -->
  <circle cx="322" cy="250" r="9" fill="#0a3f8f"/>
  <circle cx="322" cy="250" r="4.5" fill="#7ff0ff"/>

  <rect x="25" y="25" width="462" height="462" rx="107" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
</svg>
