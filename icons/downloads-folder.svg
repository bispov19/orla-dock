<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Orla Dock: pasta de Downloads com seta de download (desenho próprio). -->
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D8BEB"/>
      <stop offset="1" stop-color="#2566C9"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CC0FF"/>
      <stop offset="1" stop-color="#3C8DF0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <!-- Um pouco maior, para ocupar o mesmo espaço dos ícones de apps. -->
  <g transform="translate(64 66) scale(1.1) translate(-64 -66)">
    <!-- sombra sutil -->
    <rect x="14" y="44" width="100" height="70" rx="15" fill="#0A1E40" opacity="0.28" filter="url(#soft)"/>

    <!-- fundo da pasta, com a aba -->
    <path d="M14 34 a12 12 0 0 1 12 -12 h22 a10 10 0 0 1 7.6 3.5 l5.2 6.1 a6 6 0 0 0 4.6 2.4 h36.6 a12 12 0 0 1 12 12 v52 a12 12 0 0 1 -12 12 h-76 a12 12 0 0 1 -12 -12 z"
          fill="url(#back)"/>

    <!-- frente da pasta -->
    <rect x="14" y="44" width="100" height="66" rx="13" fill="url(#front)"/>
    <rect x="14.75" y="44.75" width="98.5" height="64.5" rx="12.25" fill="none" stroke="url(#shine)" stroke-width="1.5"/>

    <!-- seta de download (haste + ponta) e a "bandeja" -->
    <g fill="#FFFFFF">
      <rect x="57" y="55" width="14" height="25" rx="5"/>
      <path d="M42.5 72.5 a4.2 4.2 0 0 1 3 -7.2 h37 a4.2 4.2 0 0 1 3 7.2 l-18.1 18.1 a4.8 4.8 0 0 1 -6.8 0 z"/>
      <rect x="43" y="95" width="42" height="7" rx="3.5" opacity="0.92"/>
    </g>
  </g>
</svg>
