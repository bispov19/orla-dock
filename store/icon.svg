<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Orla Dock: a dock with a fan of three cards opening from it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C8DF6"/>
      <stop offset="1" stop-color="#6C4FE0"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EAFF"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#shine)"/>
  <!-- the fan: three cards opening from the centre of the dock -->
  <g transform="translate(256 388)">
    <g transform="rotate(-24)"><rect x="-44" y="-236" width="88" height="112" rx="20" fill="url(#card)" opacity="0.70"/></g>
    <g transform="rotate(24)"><rect x="-44" y="-236" width="88" height="112" rx="20" fill="url(#card)" opacity="0.70"/></g>
    <rect x="-50" y="-254" width="100" height="128" rx="22" fill="url(#card)"/>
    <circle cx="0" cy="-190" r="20" fill="#6C4FE0" opacity="0.85"/>
  </g>
  <!-- the dock -->
  <rect x="88" y="356" width="336" height="64" rx="32" fill="#FFFFFF" fill-opacity="0.94"/>
  <rect x="124" y="372" width="32" height="32" rx="9" fill="#4C8DF6"/>
  <rect x="172" y="372" width="32" height="32" rx="9" fill="#6C4FE0"/>
  <rect x="240" y="372" width="32" height="32" rx="9" fill="#5B6EEA"/>
  <rect x="308" y="372" width="32" height="32" rx="9" fill="#7FA8FA"/>
  <rect x="356" y="372" width="32" height="32" rx="9" fill="#9A86F0"/>
  <circle cx="256" cy="412" r="4" fill="#5B6EEA"/>
</svg>
